name: Auto Tag & Release on Version Change

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  check-version-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package.json version
        id: pkg_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $version = $pkg.version
          $tag = "v$version"
          Write-Host "Target Version: $version"
          Write-Host "Target Tag: $tag"

          # 기존 태그 목록 확인
          $existingTag = git tag -l $tag
          if ($existingTag) {
            Write-Host "Tag $tag already exists in repository. Skipping release build."
            echo "SHOULD_RELEASE=false" >> $env:GITHUB_ENV
          } else {
            Write-Host "New version detected ($version). Starting release pipeline!"
            echo "SHOULD_RELEASE=true" >> $env:GITHUB_ENV
            echo "VERSION=$version" >> $env:GITHUB_ENV
            echo "TAG=$tag" >> $env:GITHUB_ENV
          }

      - name: Create and push git tag
        if: env.SHOULD_RELEASE == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $env:TAG
          git push origin $env:TAG

      - name: Setup Node.js
        if: env.SHOULD_RELEASE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        if: env.SHOULD_RELEASE == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        if: env.SHOULD_RELEASE == 'true'
        run: npm ci

      - name: Build Tauri Application
        if: env.SHOULD_RELEASE == 'true'
        run: npx tauri build

      - name: Package release files into ZIP
        if: env.SHOULD_RELEASE == 'true'
        shell: pwsh
        run: |
          mkdir dist-zip

          # 1. 단일 무설치 포터블 실행 파일 압축
          $portableExe = "src-tauri/target/release/pd2-tracker.exe"
          if (Test-Path $portableExe) {
            Compress-Archive -Path $portableExe -DestinationPath "dist-zip/pd2-tracker-$($env:TAG)-portable-windows-x64.zip" -Force
            Write-Host "Compressed portable zip created."
          }

          # 2. NSIS 인스톨러 설치 파일 압축
          $installerFiles = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($installerFiles) {
            Compress-Archive -Path $installerFiles.FullName -DestinationPath "dist-zip/pd2-tracker-$($env:TAG)-installer-windows-x64.zip" -Force
            Write-Host "Compressed installer zip created."
          }

          Get-ChildItem dist-zip

      - name: Publish GitHub Release
        if: env.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PD2 시세 & 실거래 트래커 ${{ env.TAG }}
          body: |
            ## Project Diablo 2 - 시세 & 거래 도우미 ${{ env.TAG }}

            ### 📦 다운로드 안내 (ZIP 압축 배포)
            웹 브라우저의 `.exe` 직접 다운로드 차단/경고 문제를 방지하기 위해 `.zip` 압축 파일로 제공됩니다.
            다운로드 후 압축을 풀고 실행하시면 됩니다.

            - **무설치 포터블 버전**: `pd2-tracker-${{ env.TAG }}-portable-windows-x64.zip`
              (압축 해제 후 `pd2-tracker.exe`를 바로 더블클릭하여 실행)
            - **바탕화면 바로가기 설치 버전**: `pd2-tracker-${{ env.TAG }}-installer-windows-x64.zip`
              (설치 마법사를 통해 편리하게 설치)

            ---
            *본 릴리즈는 `package.json`의 버전 변경에 의해 GitHub Actions로 자동 빌드 및 배포되었습니다.*
          files: |
            dist-zip/*.zip
          generate_release_notes: true
